[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "couplet-gpt"
version = "1.0.0"
description = "Character-level GPT pretraining, Chinese couplet generation and poetry appreciation"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
couplet-gpt = "couplet_gpt.inference.cli:main"
couplet-gpt-verify = "couplet_gpt.evaluation.verify:main"

[tool.setuptools.packages.find]
include = ["couplet_gpt*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
dev = ["ruff==0.17.4"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["archive", "runs", "results"]
